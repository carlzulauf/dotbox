# definitely DON'T use Ctrl+b. lame.
unbind C-b

# ` is a cool prefix
set -g prefix `

# this allows for `` to be a literal `
bind-key ` send-prefix

# 1 is easier to reach than 0
set -g base-index 1

# this is a modern terminal after all
set -g default-terminal tmux-256color
set -g extended-keys on
set -g extended-keys-format csi-u

# allow clickable hyperlinks to work by appending terminal features
set -as terminal-features ",xterm*:hyperlinks"

# use the terminal's ANSI colours rather than tmux's built-in theme colours (tmux 3.8+)
set -g theme terminal

# Why have all this RAM if you're not going to use it?
set -g history-limit 12288

# black background, hostname red, date and 24hr time in white, extra space for aesthetics
set -g status-right '#[fg=red,bg=black] #H:#(echo $USER) '
set -g status-left '#[fg=green,bg=black] #S:#I '

# claude code session state, set on the window by hooks in dotbox-private's claude settings:
# blue ● busy, red ? waiting on an answer, ✓ idle, colored to stand out on the green status bar
# (#, escapes the style commas inside the conditionals)
set -g @claude-indicator '#{?#{==:#{@claude},busy},#[fg=blue]● #[default],#{?#{==:#{@claude},waiting},#[fg=red#,bold]? #[default],#{?#{==:#{@claude},idle},✓ ,}}}'
set -g window-status-format '#I:#{E:@claude-indicator}#W#{window_flags}'
set -g window-status-current-format '#I:#{E:@claude-indicator}#W#{window_flags}'

# make 0 window 10
bind-key 0 select-window -t ':10'

# - moves left, = moves right
bind-key - previous-window
bind-key = next-window

bind-key K kill-window
bind-key Q kill-session

# performance monitor: show btop in a popup
# bind-key p display-popup -E -T "btop" -w "90%" -h "95%" "btop"

# tmux 3.8 turned mouse on by default, which hijacks the terminal's native text selection
set -g mouse off

bind m set -g mouse on \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'

bind-key O \
  command-prompt -p 'output history to file:' -I '~/tmux_history.txt' \
  'capture-pane -S -12288 ; save-buffer %1 ; delete-buffer'
